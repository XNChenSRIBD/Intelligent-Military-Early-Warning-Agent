[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-materials-workbench"
version = "0.1.0"
description = "Public news collection, Qwen summaries and historical material browsing"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.50.2",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]
